[package]
name = "chapbook"
version = "0.1.0"
edition = "2021"
description = "chapbook — serve a directory as a readable little book"
license = "Apache-2.0"
repository = "https://github.com/weiwen99/chapbook"

[[bin]]
name = "chapbook"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
percent-encoding = "2"
maud = "0.27"
orgize = { version = "0.9", default-features = false }
comrak = { version = "0.54", default-features = false }
syntect = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
