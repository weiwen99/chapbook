[package]
name = "chapbook"
version = "0.4.3"
edition = "2024"
default-run = "chapbook"
# 实际 MSRV 由 anydoc (=0.1.8, MSRV 1.88) 决定; 显式声明让旧工具链报清晰错误
rust-version = "1.88"
description = "chapbook — serve a directory as a readable little book"
license = "Apache-2.0"
repository = "https://github.com/weiwen99/chapbook"

[[bin]]
name = "chapbook"
path = "src/main.rs"

[[bin]]
name = "chapbook-launcher"
path = "src/launcher/main.rs"
required-features = ["windows-launcher"]

[features]
default = []
windows-launcher = [
    "dep:parking_lot",
    "dep:rfd",
    "windows-sys/Win32_Graphics_Gdi",
    "windows-sys/Win32_System_LibraryLoader",
    "windows-sys/Win32_UI_Input_KeyboardAndMouse",
]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log"] }
# 纯 Rust Office/CSV -> GFM markdown (firecrawl/anydoc, MIT); MSRV 1.88 满足 (本机 1.97).
# 锁精确版本: 0.1.x 早期, API 可能变动; PDF 不启用 (浏览器原生打开).
anydoc = "=0.1.8"
chrono = "0.4"
percent-encoding = "2"
# 系统安全随机源: Windows 使用系统 RNG, 不依赖 Unix 的 /dev/urandom.
getrandom = "0.4"
# 树 JSON 端点序列化: serde 已在依赖树中 (传递), 此处显式声明为直接依赖.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
maud = "0.27"
orgize = { version = "0.9", default-features = false }
comrak = { version = "0.54", default-features = false }
# LaTeX 数学公式服务端渲染 (官方 KaTeX 0.16.7 经 QuickJS 执行, 纯构建期 C 编译);
# 渲染失败返回 Err, 由 math.rs 回退原文显示
katex = "0.4"
syntect = "5"

[target.'cfg(windows)'.dependencies]
dunce = "1"
parking_lot = { version = "0.12", optional = true }
rfd = { version = "0.17", default-features = false, optional = true }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
# 测试内构造最小 docx/xlsx fixture (与 anydoc 的 zip 版本一致, 锁文件复用)
zip = "8"
# 测试内执行内嵌浏览器 JS (canonical transport 行为矩阵): 与 katex 相同的
# 本地 vendor patch (栈 8MB), 仅测试使用, 非运行时依赖.
quick-js = "=0.4.1"

# vendor 的 quick-js (katex crate 的 JS 引擎): 加大 QuickJS 默认 JS 栈
# (256KB -> 8MB), 否则 KaTeX 解析深嵌套公式 (\cfrac 7+ 层) 栈溢出.
# 修改点: vendor/quick-js/src/bindings.rs 的 ContextWrapper::new.
# 上游 quick-js 0.4.1 无栈配置 API, 故本地 patch; 升级 katex 时需同步核对.
[patch.crates-io]
quick-js = { path = "vendor/quick-js" }

[profile.release]
lto = true
codegen-units = 1
strip = true
