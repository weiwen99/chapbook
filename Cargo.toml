[package]
name = "chapbook"
version = "0.1.0"
edition = "2024"
# 实际 MSRV 由 anydoc (=0.1.8, MSRV 1.88) 决定; 显式声明让旧工具链报清晰错误
rust-version = "1.88"
description = "chapbook — serve a directory as a readable little book"
license = "Apache-2.0"
repository = "https://github.com/weiwen99/chapbook"

[[bin]]
name = "chapbook"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log"] }
# 纯 Rust Office/CSV -> GFM markdown (firecrawl/anydoc, MIT); MSRV 1.88 满足 (本机 1.97).
# 锁精确版本: 0.1.x 早期, API 可能变动; PDF 不启用 (浏览器原生打开).
anydoc = "=0.1.8"
chrono = "0.4"
percent-encoding = "2"
maud = "0.27"
orgize = { version = "0.9", default-features = false }
comrak = { version = "0.54", default-features = false }
# LaTeX 数学公式服务端渲染 (官方 KaTeX 0.16.7 经 QuickJS 执行, 纯构建期 C 编译);
# 渲染失败返回 Err, 由 math.rs 回退原文显示
katex = "0.4"
syntect = "5"

[dev-dependencies]
tempfile = "3"
# 测试内构造最小 docx/xlsx fixture (与 anydoc 的 zip 版本一致, 锁文件复用)
zip = "8"

# vendor 的 quick-js (katex crate 的 JS 引擎): 加大 QuickJS 默认 JS 栈
# (256KB -> 8MB), 否则 KaTeX 解析深嵌套公式 (\cfrac 7+ 层) 栈溢出.
# 修改点: vendor/quick-js/src/bindings.rs 的 ContextWrapper::new.
# 上游 quick-js 0.4.1 无栈配置 API, 故本地 patch; 升级 katex 时需同步核对.
[patch.crates-io]
quick-js = { path = "vendor/quick-js" }

[profile.release]
lto = true
codegen-units = 1
strip = true
