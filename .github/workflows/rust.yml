name: Rust

# 三个平台 job 互不依赖, GitHub Actions 默认并行执行.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

# 同一 PR 的新 push 取消旧运行; main 保留每个提交的独立结果.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # linux / macos 并行; windows 是下面的独立 job.
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Build
      run: cargo build --locked --bins --verbose
    - name: Run tests
      run: cargo test --locked --verbose
    - name: Check formatting
      run: cargo fmt --check
    - name: Lint
      run: cargo clippy --locked --all-targets -- -D warnings
    - uses: actions/setup-node@v4
      if: runner.os == 'Linux'
      with:
        node-version: 22
    - name: Verify Mermaid HTTP asset and rendered SVG
      if: runner.os == 'Linux'
      env:
        CB_BIN: ${{ github.workspace }}/target/debug/chapbook
        CB_SCENARIO: M Mermaid lazy HTTP asset renders labeled SVG edges
      run: node tests/browser_tree_async_acceptance.mjs

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable-x86_64-pc-windows-gnu
        components: rustfmt, clippy
    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        path-type: inherit
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          patch
    - name: Verify QuickJS patch tool
      run: |
        where.exe patch
        patch --version
    - name: Build default CLI without launcher
      run: cargo build --locked --bins --target x86_64-pc-windows-gnu
    - name: Test Windows routes and optional launcher
      run: cargo test --locked --all-targets --features windows-launcher --target x86_64-pc-windows-gnu
    - name: Check formatting
      run: cargo fmt --check
    - name: Lint Windows targets
      run: cargo clippy --locked --all-targets --features windows-launcher --target x86_64-pc-windows-gnu -- -D warnings
